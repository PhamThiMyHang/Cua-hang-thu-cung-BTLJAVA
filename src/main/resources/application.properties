spring.application.name=CuaHangThuCung

# 1. Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/CuaHangThuCung
spring.datasource.username=root
spring.datasource.password=123456

# 2. Cấu hình Hibernate (JPA)
# 'update' giúp tự động so khớp Class Java với bảng MySQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Giữ nguyên tên cột chính xác như định nghĩa ở @Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jackson.serialization.write-dates-as-timestamps=false
springdoc.packages-to-scan=com.cuahangthucung
# Bật hiển thị tất cả log lỗi hệ thống của Spring Web
logging.level.org.springframework.web=DEBUG
# Bật hiển thị log chi tiết của Swagger/Springdoc
logging.level.org.springdoc=DEBUG
